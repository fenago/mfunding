name: PH UCC — Florida auto-fetch

# Downloads Florida's FREE full UCC bulk file (floridaucc.com, via the public
# no-auth publicsearchapi endpoint) and runs the validated scripts/ph_ucc_fl_loader.py
# to filter + push ONLY the ~7k matched MCA positions — so FL self-updates like the
# API states (CO/OR), no agent needed.
#
# Runs on a GitHub runner (not an edge function): the uncompressed files are 600MB+
# and Supabase's single-POST storage upload rejects large bodies (321MB → HTTP 400),
# so the bucket+stream-ingest path isn't usable server-side at this size. The loader
# filters locally and pushes only matched rows via the management API — no giant
# upload, identical precision (ph_ucc_norm + FL blocklist + FilingStatus freshness +
# best-debtor), idempotent via dedupe_hash.
#
# FULL snapshot, NOT the REGULAR delta: REGULAR needs a &fileDate that must match
# FL's generation calendar (recent dates 400 "not available yet" on weekends/
# holidays/before the regen), which would make an unattended cron flaky. FULL has no
# date param, is always available, and is self-correcting. Download ~318MB zipped.
#
# REQUIRED repo secret (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (management-API token — the loader pushes with it)
# Until it's added this workflow fails with a clear error and FL stays on the manual
# UI-upload path (fully functional). No npm/pip needed — the loader is Python stdlib.

on:
  schedule:
    # Daily on business days (FL regenerates the full file each business day),
    # ~07:13 UTC = off-peak, off-round-minute. Mon-Fri.
    - cron: "13 7 * * 1-5"
  workflow_dispatch: {}     # manual run from the Actions tab

# Avoid overlapping runs (a run can take several minutes on the big files).
concurrency:
  group: ph-ucc-fl-fetch
  cancel-in-progress: false

jobs:
  fetch-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch + ingest Florida UCC
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/ph_ucc_fl_fetch.sh
